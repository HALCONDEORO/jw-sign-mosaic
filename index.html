<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Watch jw.org sign-language video publications in several sign languages at once, streamed directly from the official CDN.">
<meta name="theme-color" content="#0d1117">
<title>Mosaico de Lenguas de Signos</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { padding:14px 18px 10px; border-bottom:1px solid var(--border); }
  h1 { margin:0 0 2px; font-size:20px; font-weight:600; }
  .sub { color:var(--muted); font-size:13px; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 18px; border-bottom:1px solid var(--border); }
  button, select, input { background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:6px 10px; font-size:14px; }
  button { cursor:pointer; }
  button:hover, select:hover { border-color:var(--accent); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  button.primary { background:#1f6feb; border-color:#1f6feb; color:#fff; font-weight:600; }
  .langswitch { flex-shrink:0; }
  .langswitch button { padding:4px 9px; font-size:13px; }
  .langswitch button.active { background:#1f6feb; border-color:#1f6feb; color:#fff; font-weight:600; }
  #grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr)); gap:10px; padding:12px; }
  .tile { background:var(--panel); border:1px solid var(--border); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; }
  .tile:fullscreen { border-radius:0; }
  .tile:fullscreen video { flex:1; height:auto; }
  .tile-head { display:flex; align-items:center; gap:6px; padding:6px 8px; }
  .tile-head .lang { font-weight:600; font-size:13px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile-head button { padding:3px 7px; font-size:13px; }
  .tile select.programs { margin:0 8px 6px; font-size:12px; max-width:calc(100% - 16px); }
  .videowrap { position:relative; background:#000; }
  video { display:block; width:100%; aspect-ratio:16/9; }
  .status { padding:10px; color:var(--muted); font-size:13px; }
  .status.err { color:#f85149; }
  .tile.novideo { opacity:.8; }
  .tile select.partial { border-color:#d29922; }
  .nomsg { display:none; }
  .tile.novideo video { display:none; }
  .tile.novideo .nomsg { display:flex; aspect-ratio:16/9; align-items:center; justify-content:center; text-align:center; padding:12px; background:#000; color:#e6edf3; font-weight:600; font-size:15px; }
  .tile.indet .nomsg { visibility:hidden; }
  .tile.novideo .status:not(.err) { display:none !important; }
  .tile.novideo .status { color:var(--muted); font-style:italic; }
  footer { padding:12px 18px; color:var(--muted); font-size:12px; border-top:1px solid var(--border); }
  .addwrap { position:relative; }
  #addPanel { position:absolute; right:0; top:calc(100% + 4px); width:320px; max-height:320px; display:flex; flex-direction:column; background:var(--panel); border:1px solid var(--border); border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.5); z-index:20; }
  #addPanel[hidden] { display:none; }
  .controls { position:relative; }
  .addwrap { position:static; }
  #addPanel { right:18px; width:min(320px, calc(100% - 36px)); }
  #addSearch { margin:8px; }
  #addList { overflow-y:auto; }
  #addList button { display:block; width:100%; text-align:left; border:0; border-radius:0; background:none; padding:7px 10px; font-size:13px; }
  #addList button:hover { background:#21262d; }
  #addList button.added { color:var(--muted); }
  .counter { color:var(--muted); font-size:13px; }
  .tile .note { font-size:12px; color:var(--muted); padding:0 8px 6px; }
  .globrow { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:8px 18px; border-bottom:1px solid var(--border); background:#0a0d12; font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <h1 id="tTitle" style="flex:1">Mosaico de Lenguas de Signos</h1>
    <div class="langswitch">
      <button id="langES">ES</button>
      <button id="langEN">EN</button>
    </div>
  </div>
  <div class="sub" id="tSub">JW Broadcasting y otras publicaciones con vídeo en lenguas de signos, varias a la vez. Vídeo en directo desde jw.org.</div>
</header>
<div class="controls">
  <button class="primary" id="playAll">▶</button>
  <button id="pauseAll">⏸</button>
  <button id="syncAll">⟳</button>
  <span class="counter" id="counter" aria-live="polite"></span>
  <span class="counter" id="notice" role="status"></span>
  <label class="counter" for="vol" id="tVol"></label>
  <input id="vol" type="range" min="0" max="1" step="0.05" value="1" style="width:110px;padding:0">
  <button id="addAll"></button>
  <button id="stopAdd" hidden></button>
  <button id="retryFailed" hidden></button>
  <button id="rmAll"></button>
  <button id="shareBtn"></button>
  <span id="addProgress" role="status"></span>
  <span style="flex:1"></span>
  <div class="addwrap">
    <button id="addBtn" aria-expanded="false" aria-controls="addPanel">＋</button>
    <div id="addPanel" hidden>
      <input id="addSearch" type="search" autocomplete="off" aria-label="Search language">
      <div id="addList" role="listbox" aria-label="Sign languages"></div>
    </div>
  </div>
</div>
<div class="globrow">
  <span id="tForAll">Para todas:</span>
  <select id="globColl" aria-label="Section for all tiles"></select>
  <select id="globProg" aria-label="Publication for all tiles"></select>
  <select id="gBook" hidden></select>
  <select id="gChap" hidden></select>
  <select id="gVerse" hidden></select>
  <button id="globApply"></button>
</div>
<div class="globrow" id="jumpRow">
  <span id="tJump"></span>
  <input id="jumpSlider" type="range" min="0" max="1000" value="0" style="flex:1;min-width:140px;padding:0" aria-label="Position">
  <span id="jumpPct" style="min-width:3.5em">0%</span>
  <button id="back10"></button>
  <button id="fwd10"></button>
</div>
<p id="capacityNote" style="margin:10px 18px;color:var(--muted);font-size:13px"></p>
<div id="grid"></div>
<footer id="tFooter"></footer>
<script>
'use strict';
const API = 'https://data.jw-api.org/mediator/v1';
// No fixed tile limit. Device capacity, media availability and bandwidth still apply.
let addingAll = false;
let stopAddingAll = false;
let mosaicGen = 0; // bumped by Remove all: an Add-all loop or a pending load that started earlier must not add or revive tiles
const I18N = {
  es: {
    title: 'Mosaico de Lenguas de Signos', htmlLang: 'es',
    sub: 'JW Broadcasting y otras publicaciones con vídeo en lenguas de signos, varias a la vez. Vídeo en directo desde jw.org.',
    playAll: '▶ Reproducir todos', pauseAll: '⏸ Pausar todos', syncAll: '⟳ Sincronizar',
    addBtn: '＋ Añadir lengua…', searchPh: 'Buscar lengua (nombre o código)…', noResults: 'Sin resultados.',
    collLbl: 'Sección', progLbl: 'Publicación', globCollLbl: 'Sección para todas', globProgLbl: 'Publicación para todas',

    adding: (n, total) => 'Añadiendo ' + n + ' de ' + total + '…',
    emptyCatalog: 'Catálogo no disponible. Puedes conservar tus lenguas guardadas e intentarlo más tarde.',

    langListLbl: 'Lenguas de signos', langEsTip: 'Cambiar a español', langEnTip: 'Cambiar a inglés',
    rmAll: '✕ Quitar todas', confirmRmAll: 'Quitar todas las lenguas del mosaico. Los vídeos se detendrán. ¿Continuar?',

    syncSkipped: n => n + ' sin cargar aún; pulsa Sincronizar cuando estén listas.',
    volLbl: 'Volumen',
    shareBtn: '🔗 Copiar enlace', shareCopied: 'Enlace copiado.', sharePrompt: 'Copia este enlace:',
    jumpLbl: 'Saltar todas a la misma posición:', back10: '−10 s', fwd10: '+10 s', posLbl: 'Posición',
    retryFailed: n => '↻ Reintentar fallidas (' + n + ')',
    partialTip: 'La lista de publicaciones está incompleta. Usa Reintentar fallidas.',

  },
  en: {
    title: 'Sign Language Mosaic', htmlLang: 'en',
    sub: 'JW Broadcasting and other sign-language video publications, several at once. Streamed live from jw.org.',
    playAll: '▶ Play all', pauseAll: '⏸ Pause all', syncAll: '⟳ Sync',
    addBtn: '＋ Add language…', searchPh: 'Search language (name or code)…', noResults: 'No results.',
    collLbl: 'Section', progLbl: 'Publication', globCollLbl: 'Section for all tiles', globProgLbl: 'Publication for all tiles',
    forAll: 'For all:', applyAll: 'Apply to all',
    counter: n => n + ' languages selected',
    loading: 'Loading…', retrying: 'Retrying…',
    slowMsg: 'Still not loading. Tap here to retry.',
    bibleColl: 'Bible: book, chapter and verse', wholeChapter: 'Whole chapter', bookLbl: 'Book', chapLbl: 'Chapter', verseLbl: 'Verse',
    noEquiv: 'This publication is not available in this language.',
    loadErr: e => 'Load error (' + e + ')',
    failMsg: 'The video failed to load. Tap here or use Retry failed.',
    noVideoPub: 'No video of this publication in this language.',
    noMp4: 'No compatible MP4.',
    addAll: 'Add all catalogue languages…', stopAdd: 'Stop adding',
    confirmAll: n => 'Add ' + n + ' more sign languages, one at a time, keeping the current publication. This video may not exist in every language. Many streams may exhaust memory, battery or data. Your device is not guaranteed to play them all. Continue?',
    adding: (n, total) => 'Adding ' + n + ' of ' + total + '…',
    emptyCatalog: 'Catalogue unavailable. Keep your saved languages and try again later.',
    allAdded: 'All catalogue languages have already been added.',
    addedSummary: (n, stopped) => (stopped ? 'Stopped adding. ' : 'Finished adding. ') + n + ' languages added.',
    capacity: 'Start with the usual eight and add more. No fixed limit; actual capacity depends on your device and connection.',
    audioTip: 'Listen to this language', fsTip: 'Fullscreen', rmTip: 'Remove',
    langListLbl: 'Sign languages', langEsTip: 'Switch to Spanish', langEnTip: 'Switch to English',
    rmAll: '✕ Remove all', confirmRmAll: 'Remove every language from the mosaic. Playback will stop. Continue?',
    syncing: 'Starting all together…',
    syncSkipped: n => n + ' not loaded yet; press Sync when they are ready.',
    volLbl: 'Volume',
    shareBtn: '🔗 Copy link', shareCopied: 'Link copied.', sharePrompt: 'Copy this link:',
    jumpLbl: 'Jump all to the same position:', back10: '−10 s', fwd10: '+10 s', posLbl: 'Position',
    retryFailed: n => '↻ Retry failed (' + n + ')',
    partialTip: 'The publication list is incomplete. Use Retry failed.',
    listIncomplete: 'The list is incomplete and the chosen publication was not found. Tap here or use Retry failed.',
    naText: 'Not available in this language',
    footer: 'Videos served directly from jw.org servers (public API and CDN). Personal tool, not affiliated or endorsed. Simultaneous playback depends on video availability and your device.'
  }
};
// Storage is optional: blocked access or a full quota must not stop playback.
function readStored(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}
function writeStored(key, value) {
  try { localStorage.setItem(key, value); return true; } catch (e) { return false; }
}
let LANG = (readStored('jwSignMosaic.lang') || (navigator.language || 'es')).toLowerCase().startsWith('en') ? 'en' : 'es';
const t = k => I18N[LANG][k];

const DEFAULT_CODES = ['LSE','ASL','BSL','LSB','LSM','LSF','ISL','DGS'];
const LS_KEY = 'jwSignMosaic.v2';
function collectionsFor() { return [
  ['StudioMonthlyPrograms', 'JW Broadcasting'],
  ['VODStudio', LANG === 'es' ? 'JW Broadcasting (archivo)' : 'JW Broadcasting (archive)'],
  ['VODProgramsEvents', LANG === 'es' ? 'Programas espirituales' : 'Spiritual programs'],
  ['VODMusicVideos', LANG === 'es' ? 'Música' : 'Music'],
  ['VODSeries', LANG === 'es' ? 'Series' : 'Series'],
  ['VODChildren', LANG === 'es' ? 'Niños' : 'Children'],
  ['VODTeenagers', LANG === 'es' ? 'Jóvenes' : 'Teenagers'],
  ['VODFamily', LANG === 'es' ? 'Familia' : 'Family'],
  ['VODMinistry', LANG === 'es' ? 'Reuniones y ministerio' : 'Meetings and ministry'],
  ['VODMinistryTools', LANG === 'es' ? 'Ayudas para la predicación' : 'Ministry tools'],
  ['VODOurActivities', LANG === 'es' ? 'Qué hacemos' : 'What we do'],
  ['VODOurOrganization', LANG === 'es' ? 'Nuestra organización' : 'Our organization'],
  ['VODBible', LANG === 'es' ? 'La Biblia' : 'The Bible'],
  ['BIBLE', t('bibleColl')],
  ['VODMovies', LANG === 'es' ? 'Producciones audiovisuales' : 'Movies'],
  ['VODIntExp', LANG === 'es' ? 'Entrevistas y experiencias' : 'Interviews and experiences'],
]; }
const grid = document.getElementById('grid');
const tiles = new Map(); // code -> entry
let ALL_SIGN_LANGS = [];

// The publication the user chose for the whole mosaic. New tiles use it strictly, so a tile never falls back to "the first video".
let SEL = { coll: '', key: '' };
function sanitizeSel(s) {
  const ok = s && typeof s.coll === 'string' && typeof s.key === 'string' && /^[A-Za-z0-9_.-]{1,80}$/.test(s.key) && /^[A-Za-z0-9]{1,40}$/.test(s.coll);
  return ok ? { coll: s.coll, key: s.key } : { coll: '', key: '' };
}
function loadState() {
  try {
    const saved = JSON.parse(readStored(LS_KEY) || 'null');
    if (saved && Array.isArray(saved.langs) && saved.langs.length) return saved;
  } catch (e) {}
  try { // migration from v1
    const old = JSON.parse(readStored('jwSignMosaic.langs.v1') || 'null');
    if (Array.isArray(old) && old.length) return { langs: old };
  } catch (e) {}
  return { langs: DEFAULT_CODES.map(c => ({ code: c })) };
}
function saveState() {
  // want = the publication a tile was asked for but could not show; without it a reload would load the first video
  const langs = [...tiles.values()].map(x => ({ code: x.code, coll: x.coll, prog: x.prog, want: x.want || '' }));
  writeStored(LS_KEY, JSON.stringify({ langs, sel: SEL }));
}
function updateCounter() { document.getElementById('counter').textContent = t('counter')(tiles.size); }
function tileGroup(x) { // 0 = loads fine, 1 = load error (retriable), 2 = no video in this language
  if (x.status && x.status.style.display !== 'none' && x.status.classList.contains('err') && x.statusKey !== 'slowMsg') return 1;
  return x.tile.classList.contains('novideo') ? 2 : 0;
}
function sortTiles() { // good tiles first, then load errors, then unavailable; stable inside each group, keeps playback
  const groups = [[], [], []];
  for (const x of tiles.values()) groups[tileGroup(x)].push(x);
  const order = [].concat(...groups);
  if (grid.children) { // already in order: touch nothing, so nothing jumps
    const cur = [...grid.children];
    if (cur.length === order.length && order.every((x, i) => cur[i] === x.tile)) return;
  }
  for (const x of order) grid.appendChild(x.tile); // moves the node, videos keep playing
}

function setStatus(entry, key, arg, isErr) { // every visible status comes from the active dictionary
  entry.statusKey = key; entry.statusArg = arg;
  entry.status.style.display = '';
  entry.status.classList.toggle('err', !!isErr);
  const v = t(key);
  entry.status.textContent = (typeof v === 'function') ? v(arg) : v;
  updateRetryUI(); sortTiles();
}
function statusFailed(x) { return x.status.style.display !== 'none' && x.status.classList.contains('err'); }
function isFailed(x) { return !!x.partial || statusFailed(x); }
function updateRetryUI() {
  const btn = document.getElementById('retryFailed');
  const n = [...tiles.values()].filter(isFailed).length;
  btn.hidden = !n;
  if (n) btn.textContent = t('retryFailed')(n);
}
function cancelRetry(x) { clearTimeout(x.retryTimer); x.retryTimer = null; }
function scheduleRetry(x, ms) { // one automatic reload of a failed source; dropped when the tile is removed or its source changes
  const src = x.video.src;
  cancelRetry(x);
  x.retryTimer = setTimeout(() => {
    x.retryTimer = null;
    if (tiles.get(x.code) !== x || x.video.src !== src) return; // removed, or another source was chosen meanwhile
    x.video.src = src; x.video.load(); if (x.armWatchdog) x.armWatchdog();
  }, ms);
}
async function retryEntry(x) {
  if (tiles.get(x.code) !== x) return; // removed while queued
  const failedVideo = statusFailed(x);
  if (x.partial && (!failedVideo || x.video.src)) await fillPrograms(x, x.prog, false, false, true); // incomplete list: refetch it without touching the playing video
  if (!failedVideo) return;
  if (x.resetRetry) x.resetRetry();
  x.syncSkipSrc = ''; // a valid retry may resume this tile
  if (x.video.src) { // the file is known: just reload it
    x.shouldPlay = false; // a retried tile reloads paused; Play all or Sync starts it with the others
    setStatus(x, 'loading'); x.video.load(); if (x.armWatchdog) x.armWatchdog();
  } else { // the listing never arrived: fetch it again, keeping the chosen publication
    setStatus(x, 'loading');
    await fillPrograms(x, x.prog || x.want, !!(x.prog || x.want));
  }
}
async function retryFailed() {
  const queue = [...tiles.values()].filter(isFailed);
  const worker = async () => { while (queue.length) await retryEntry(queue.shift()); };
  await Promise.all(Array.from({ length: Math.min(4, queue.length) }, worker)); // only the failed tiles, 4 at a time
  updateRetryUI();
}
function labelFor(code) {
  const l = ALL_SIGN_LANGS.find(x => x.code === code);
  return l ? l.name + ' (' + l.code + ')' : code;
}

async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

// Returns [{naturalKey,title,group,media,agnostic}] flattening one subcategory level.
async function fetchCollection(code, collKey) {
  const out = [];
  try {
    const d = await fetchJSON(`${API}/categories/${code}/${collKey}?detailed=1&clientType=www`);
    const cat = d.category || {};
    const own = (cat.media || []).filter(m => m.type === 'video');
    for (const m of own) out.push({ naturalKey: m.naturalKey, title: m.title, group: '', media: m, agnostic: m.languageAgnosticNaturalKey });
    for (const sub of (cat.subcategories || [])) {
      const media = sub.media || [];
      if (media.length) {
        for (const m of media.filter(x => x.type === 'video')) out.push({ naturalKey: m.naturalKey, title: m.title, group: sub.name || sub.key, media: m, agnostic: m.languageAgnosticNaturalKey });
      } else if (sub.key && sub.key !== collKey) {
        try {
          const sd = await fetchJSON(`${API}/categories/${code}/${sub.key}?detailed=1&clientType=www`);
          const scat = sd.category || {};
          for (const m of (scat.media || []).filter(x => x.type === 'video')) {
            out.push({ naturalKey: m.naturalKey, title: m.title, group: sub.name || sub.key, media: m, agnostic: m.languageAgnosticNaturalKey });
          }
        } catch (e) { out.partial = true; } // this subcategory failed: keep what we have and let the user retry
      }
    }
  } catch (e) { out.failed = true; } // request failed: different from a catalogue that is genuinely empty
  return out;
}

// ---- Bible passage (book, chapter, verse) -----------------------------------------------------------
// The sign-language Bible is not in the mediator listings: it comes from the pub-media API, one video per chapter, with verse markers.

const PUBMEDIA = 'https://b.jw-cdn.org/apis/pub-media/GETPUBMEDIALINKS?output=json&pub=nwt&fileformat=MP4&alllangs=0';

function validLanguageCode(code) {
  return typeof code === 'string' && /^[A-Z][A-Z0-9]{0,19}$/.test(code);
}
function buildShareHash(codes, coll, prog) {
  const p = new URLSearchParams();
  p.set('l', codes.join(','));

  return p.toString().replace(/%2C/g, ',');
}
// Returns { langs } or null. Every value is validated; nothing from the URL is trusted.
function parseShareHash(hash, collKeys) {
  const p = new URLSearchParams(String(hash || '').replace(/^#/, ''));
  const codes = [];
  for (const c of (p.get('l') || '').split(',')) if (validLanguageCode(c) && !codes.includes(c) && codes.length < 300) codes.push(c);
  if (!codes.length) return null;
  const coll = collKeys.includes(p.get('c')) ? p.get('c') : '';
  const prog = /^[A-Za-z0-9_.-]{1,80}$/.test(p.get('p') || '') ? p.get('p') : '';
  return { langs: codes.map(code => coll ? (prog ? { code, coll, prog } : { code, coll }) : { code }) };
}

  const seen = new Set();
  return (Array.isArray(langs) ? langs : []).filter(l => {
    if (!l || !validLanguageCode(l.code) || seen.has(l.code)) return false;
    if (catalog.length && !catalog.some(x => x.code === l.code && x.isSignLanguage)) return false;
    seen.add(l.code); return true;
  });
}
function remainingLanguages(catalog, selected) {

  return catalog.filter(l => {

    seen.add(l.code); return true;
  });

async function addCatalogLanguages() {

  if (!ALL_SIGN_LANGS.length) { progress.textContent = t('emptyCatalog'); return; }
  const pending = remainingLanguages(ALL_SIGN_LANGS, tiles.keys());
  if (!pending.length) { progress.textContent = t('allAdded'); return; }
  if (!confirm(t('confirmAll')(pending.length))) return;
  addingAll = true; stopAddingAll = false;
  const button = document.getElementById('addAll');
  const stop = document.getElementById('stopAdd');
  let addedCount = 0;
  button.disabled = true; stop.hidden = false;
  const reference = [...tiles.values()].find(x => x.prog && x.items.length);
  const publication = reference ? {coll:reference.coll, prog:reference.prog} : {};
  const gen = mosaicGen;
  try {
    for (let i = 0; i < pending.length; i++) {
      if (stopAddingAll || gen !== mosaicGen) break;
      progress.textContent = t('adding')(i + 1, pending.length);
      // Snapshot the selected publication once; do not silently fall back for unavailable translations.
      const before = tiles.size;

      await new Promise(resolve => setTimeout(resolve, 400));

function autoResume() {
  if (syncing || userPaused) return;
  for (const x of tiles.values()) {
    if (x.shouldPlay && x.video.src && x.video.paused && x.syncSkipSrc !== x.video.src && !x.tile.classList.contains('novideo')) x.video.play().catch(() => {});
  }
}
setInterval(autoResume, 15000);
setInterval(() => { for (const x of tiles.values()) loopVerse(x); }, 100); // verse loop: wrap at the next verse marker

(async function init() {
  applyI18n();
  await loadCatalog();
  const shared = parseShareHash(location.hash, collectionsFor().map(c => c[0]));
  const state = shared || loadState();
  SEL = sanitizeSel(state.sel);
  if (shared && state.langs[0] && state.langs[0].prog) SEL = sanitizeSel({ coll: state.langs[0].coll, key: normKey({ naturalKey: state.langs[0].prog }) });
  if (shared) history.replaceState(null, '', location.pathname + location.search); // the link is consumed once; later changes are saved normally
  let restored = restoredLanguages(state.langs, ALL_SIGN_LANGS);
  // Older saved states: a tile with no publication inside a collection where others play one was "not available", not "first video".
  if (!SEL.key) { const ref = restored.find(l => l.prog); if (ref) SEL = sanitizeSel({ coll: ref.coll, key: normKey({ naturalKey: ref.prog }) }); }
  if (SEL.key) restored = restored.map(l => (!l.prog && !l.want && l.coll === SEL.coll) ? { ...l, want: SEL.key } : l);
  const gen0 = mosaicGen;
  for (const l of restored) {
    if (gen0 !== mosaicGen) break; // Remove all pressed while the saved tiles were still being restored
    await addTile({ ...l, label: l.label || labelFor(l.code) });
    await new Promise(r => setTimeout(r, 400)); // stagger: do not flood the network with N videos at once
  }
})();
</script>
