<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mosaico de Lenguas de Signos</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { padding:14px 18px 10px; border-bottom:1px solid var(--border); }
  h1 { margin:0 0 2px; font-size:20px; font-weight:600; }
  .sub { color:var(--muted); font-size:13px; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 18px; border-bottom:1px solid var(--border); }
  button, select, input { background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:6px 10px; font-size:14px; }
  button { cursor:pointer; }
  button:hover, select:hover { border-color:var(--accent); }
  button.primary { background:#1f6feb; border-color:#1f6feb; color:#fff; font-weight:600; }
  .langswitch { flex-shrink:0; }
  .langswitch button { padding:4px 9px; font-size:13px; }
  .langswitch button.active { background:#1f6feb; border-color:#1f6feb; color:#fff; font-weight:600; }
  #grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:10px; padding:12px; }
  .tile { background:var(--panel); border:1px solid var(--border); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; }
  .tile:fullscreen { border-radius:0; }
  .tile:fullscreen video { flex:1; height:auto; }
  .tile-head { display:flex; align-items:center; gap:6px; padding:6px 8px; }
  .tile-head .lang { font-weight:600; font-size:13px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile-head button { padding:3px 7px; font-size:13px; }
  .tile select.programs { margin:0 8px 6px; font-size:12px; max-width:calc(100% - 16px); }
  .videowrap { position:relative; background:#000; }
  video { display:block; width:100%; aspect-ratio:16/9; }
  .status { padding:10px; color:var(--muted); font-size:13px; }
  .status.err { color:#f85149; }
  .tile.novideo { opacity:.55; }
  .tile.novideo .videowrap { display:none; }
  .tile.novideo .status { color:var(--muted); font-style:italic; }
  footer { padding:12px 18px; color:var(--muted); font-size:12px; border-top:1px solid var(--border); }
  .addwrap { position:relative; }
  #addPanel { position:absolute; right:0; top:calc(100% + 4px); width:320px; max-height:320px; display:flex; flex-direction:column; background:var(--panel); border:1px solid var(--border); border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.5); z-index:20; }
  #addPanel[hidden] { display:none; }
  #addSearch { margin:8px; }
  #addList { overflow-y:auto; }
  #addList button { display:block; width:100%; text-align:left; border:0; border-radius:0; background:none; padding:7px 10px; font-size:13px; }
  #addList button:hover { background:#21262d; }
  #addList button.added { color:var(--muted); }
  .counter { color:var(--muted); font-size:13px; }
  .globrow { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:8px 18px; border-bottom:1px solid var(--border); background:#0a0d12; font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <h1 id="tTitle" style="flex:1">Mosaico de Lenguas de Signos</h1>
    <div class="langswitch">
      <button id="langES">ES</button>
      <button id="langEN">EN</button>
    </div>
  </div>
  <div class="sub" id="tSub">JW Broadcasting y otras publicaciones con vídeo en lenguas de signos, varias a la vez. Vídeo en directo desde jw.org.</div>
</header>
<div class="controls">
  <button class="primary" id="playAll">▶</button>
  <button id="pauseAll">⏸</button>
  <button id="syncAll">⟳</button>
  <span class="counter" id="counter"></span>
  <span style="flex:1"></span>
  <div class="addwrap">
    <button id="addBtn">＋</button>
    <div id="addPanel" hidden>
      <input id="addSearch" type="search" autocomplete="off">
      <div id="addList"></div>
    </div>
  </div>
</div>
<div class="globrow">
  <span id="tForAll">Para todas:</span>
  <select id="globColl"></select>
  <select id="globProg"></select>
  <button id="globApply"></button>
</div>
<div id="grid"></div>
<footer id="tFooter"></footer>
<script>
'use strict';
const API = 'https://data.jw-api.org/mediator/v1';
const MAX_TILES = 16; // límite de vídeos simultáneos / simultaneous video limit
const I18N = {
  es: {
    title: 'Mosaico de Lenguas de Signos', htmlLang: 'es',
    sub: 'JW Broadcasting y otras publicaciones con vídeo en lenguas de signos, varias a la vez. Vídeo en directo desde jw.org.',
    playAll: '▶ Reproducir todos', pauseAll: '⏸ Pausar todos', syncAll: '⟳ Sincronizar',
    addBtn: '＋ Añadir lengua…', searchPh: 'Buscar lengua (nombre o código)…', noResults: 'Sin resultados.',
    forAll: 'Para todas:', applyAll: 'Aplicar a todas',
    counter: n => n + ' / ' + MAX_TILES + ' lenguas',
    loading: 'Cargando…', retrying: 'Reintentando…',
    slowMsg: 'Sigue sin cargar. Toca aquí para reintentar.',
    noEquiv: 'Esta publicación no está disponible en esta lengua.',
    loadErr: e => 'Error al cargar (' + e + ')',
    failMsg: 'No se pudo cargar el vídeo. Pulsa Reproducir todos para reintentar.',
    noVideoPub: 'Sin vídeo de esta publicación en esta lengua.',
    noMp4: 'Sin MP4 compatible.',
    maxAlert: 'Máximo ' + MAX_TILES + ' lenguas simultáneas. Quita alguna para añadir otra.',
    audioTip: 'Escuchar esta lengua', fsTip: 'Pantalla completa', rmTip: 'Quitar',
    footer: 'Vídeos servidos directamente desde los servidores de jw.org (API pública y CDN). Herramienta personal, sin afiliación ni respaldo oficial. Máximo 16 lenguas simultáneas por rendimiento del navegador.'
  },
  en: {
    title: 'Sign Language Mosaic', htmlLang: 'en',
    sub: 'JW Broadcasting and other sign-language video publications, several at once. Streamed live from jw.org.',
    playAll: '▶ Play all', pauseAll: '⏸ Pause all', syncAll: '⟳ Sync',
    addBtn: '＋ Add language…', searchPh: 'Search language (name or code)…', noResults: 'No results.',
    forAll: 'For all:', applyAll: 'Apply to all',
    counter: n => n + ' / ' + MAX_TILES + ' languages',
    loading: 'Loading…', retrying: 'Retrying…',
    slowMsg: 'Still not loading. Tap here to retry.',
    noEquiv: 'This publication is not available in this language.',
    loadErr: e => 'Load error (' + e + ')',
    failMsg: 'The video failed to load. Press Play all to retry.',
    noVideoPub: 'No video of this publication in this language.',
    noMp4: 'No compatible MP4.',
    maxAlert: 'Maximum ' + MAX_TILES + ' simultaneous languages. Remove one to add another.',
    audioTip: 'Listen to this language', fsTip: 'Fullscreen', rmTip: 'Remove',
    footer: 'Videos served directly from jw.org servers (public API and CDN). Personal tool, not affiliated or endorsed. Maximum 16 simultaneous languages for browser performance.'
  }
};
let LANG = (localStorage.getItem('jwSignMosaic.lang') || (navigator.language || 'es')).toLowerCase().startsWith('en') ? 'en' : 'es';
const t = k => I18N[LANG][k];

const DEFAULT_CODES = ['LSE','ASL','BSL','LSB','LSM','LSF','ISL','DGS'];
const LS_KEY = 'jwSignMosaic.v2';
function collectionsFor() { return [
  ['StudioMonthlyPrograms', 'JW Broadcasting'],
  ['VODStudio', LANG === 'es' ? 'JW Broadcasting (archivo)' : 'JW Broadcasting (archive)'],
  ['VODProgramsEvents', LANG === 'es' ? 'Programas espirituales' : 'Spiritual programs'],
  ['VODMusicVideos', LANG === 'es' ? 'Música' : 'Music'],
  ['VODSeries', LANG === 'es' ? 'Series' : 'Series'],
  ['VODChildren', LANG === 'es' ? 'Niños' : 'Children'],
  ['VODTeenagers', LANG === 'es' ? 'Jóvenes' : 'Teenagers'],
  ['VODFamily', LANG === 'es' ? 'Familia' : 'Family'],
  ['VODMinistry', LANG === 'es' ? 'Reuniones y ministerio' : 'Meetings and ministry'],
  ['VODOurActivities', LANG === 'es' ? 'Qué hacemos' : 'What we do'],
  ['VODOurOrganization', LANG === 'es' ? 'Nuestra organización' : 'Our organization'],
  ['VODBible', LANG === 'es' ? 'La Biblia' : 'The Bible'],
  ['VODMovies', LANG === 'es' ? 'Producciones audiovisuales' : 'Movies'],
  ['VODIntExp', LANG === 'es' ? 'Entrevistas y experiencias' : 'Interviews and experiences'],
]; }
const grid = document.getElementById('grid');
const tiles = new Map(); // code -> entry
let ALL_SIGN_LANGS = [];

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (saved && Array.isArray(saved.langs) && saved.langs.length) return saved;
  } catch (e) {}
  try { // migración desde v1
    const old = JSON.parse(localStorage.getItem('jwSignMosaic.langs.v1') || 'null');
    if (Array.isArray(old) && old.length) return { langs: old };
  } catch (e) {}
  return { langs: DEFAULT_CODES.map(c => ({ code: c })) };
}
function saveState() {
  const langs = [...tiles.values()].map(x => ({ code: x.code, coll: x.coll, prog: x.prog }));
  localStorage.setItem(LS_KEY, JSON.stringify({ langs }));
}
function updateCounter() { document.getElementById('counter').textContent = t('counter')(tiles.size); }
function labelFor(code) {
  const l = ALL_SIGN_LANGS.find(x => x.code === code);
  return l ? l.name + ' (' + l.code + ')' : code;
}

async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

// Devuelve [{naturalKey,title,group,media,agnostic}] aplanando un nivel de subcategorías.
async function fetchCollection(code, collKey) {
  const out = [];
  try {
    const d = await fetchJSON(`${API}/categories/${code}/${collKey}?detailed=1&clientType=www`);
    const cat = d.category || {};
    const own = (cat.media || []).filter(m => m.type === 'video');
    for (const m of own) out.push({ naturalKey: m.naturalKey, title: m.title, group: '', media: m, agnostic: m.languageAgnosticNaturalKey });
    for (const sub of (cat.subcategories || [])) {
      const media = sub.media || [];
      if (media.length) {
        for (const m of media.filter(x => x.type === 'video')) out.push({ naturalKey: m.naturalKey, title: m.title, group: sub.name || sub.key, media: m, agnostic: m.languageAgnosticNaturalKey });
      } else if (sub.key && sub.key !== collKey) {
        try {
          const sd = await fetchJSON(`${API}/categories/${code}/${sub.key}?detailed=1&clientType=www`);
          const scat = sd.category || {};
          for (const m of (scat.media || []).filter(x => x.type === 'video').slice(0, 100)) {
            out.push({ naturalKey: m.naturalKey, title: m.title, group: sub.name || sub.key, media: m, agnostic: m.languageAgnosticNaturalKey });
          }
        } catch (e) { /* colección vacía para esta lengua */ }
      }
    }
  } catch (e) { return []; }
  return out;
}

function pickFile(media) {
  const mp4s = (media.files || [])
    .filter(f => f.mimetype === 'video/mp4' && f.progressiveDownloadURL)
    .map(f => {
      const m = f.progressiveDownloadURL.match(/_r(\d+)P\.mp4/);
      return { url: f.progressiveDownloadURL, res: m ? parseInt(m[1], 10) : 9999 };
    })
    .sort((a, b) => a.res - b.res);
  if (!mp4s.length) return null;
  const preferred = mp4s.find(f => f.res === 240) || mp4s[0];
  return preferred.url;
}

function normKey(it) { return (it && (it.agnostic || it.naturalKey)) ? String(it.agnostic || it.naturalKey).replace(/_[A-Z]{2,5}(_\d+_VIDEO)$/, '\$1') : ''; }
function allVideos() { return [...tiles.values()].map(x => x.video); }

function muteOthers(except) {
  for (const x of tiles.values()) {
    const on = (x === except);
    x.video.muted = !on;
    x.audioBtn.textContent = on ? '🔊' : '🔇';
  }
}

async function loadTileProgram(entry, item) {
  const { video, status, tile } = entry;
  entry.prog = item ? item.naturalKey : '';
  if (!item) {
    tile.classList.add('novideo');
    video.pause(); video.removeAttribute('src'); video.load();
    status.style.display = ''; status.classList.remove('err');
    status.textContent = t('noVideoPub');
    saveState(); refreshGlobalPicker();
    return;
  }
  tile.classList.remove('novideo');
  try {
    const src = pickFile(item.media || {});
    if (src) {
      status.style.display = ''; status.classList.remove('err'); status.textContent = t('loading');
      video.src = src; video.load(); video.play().catch(() => {});
      if (entry.armWatchdog) entry.armWatchdog();
    } else { status.textContent = t('noMp4'); status.classList.add('err'); }
  } catch (e) { status.textContent = t('loadErr')(e.message); status.classList.add('err'); }
  saveState(); refreshGlobalPicker();
}

async function fillPrograms(entry, keepProg, strict) {
  const { code, sel } = entry;
  sel.innerHTML = '';
  const items = await fetchCollection(code, entry.coll);
  entry.items = items;
  const groups = new Map();
  for (const it of items.slice(0, 200)) {
    if (!groups.has(it.group)) groups.set(it.group, []);
    groups.get(it.group).push(it);
  }
  for (const [g, arr] of groups) {
    const parent = g ? (() => { const og = document.createElement('optgroup'); og.label = g; sel.appendChild(og); return og; })() : sel;
    for (const it of arr) {
      const o = document.createElement('option');
      o.value = it.naturalKey;
      o.textContent = it.title;
      parent.appendChild(o);
    }
  }
  let idx = 0;
  if (keepProg) {
    const nk = normKey({ naturalKey: keepProg });
    const found = items.findIndex(it => it.naturalKey === keepProg || (nk && normKey(it) === nk));
    if (found >= 0) idx = found;
    else if (strict) { // pidieron una publicación concreta y no hay equivalente en esta lengua
      sel.selectedIndex = -1;
      entry.prog = '';
      const { status, tile, video } = entry;
      tile.classList.add('novideo');
      video.pause(); video.removeAttribute('src'); video.load();
      status.style.display = ''; status.classList.remove('err');
      status.textContent = t('noEquiv');
      saveState(); refreshGlobalPicker();
      return;
    }
  }
  sel.selectedIndex = idx;
  await loadTileProgram(entry, items[idx]);
}

async function addTile(lang) {
  if (tiles.has(lang.code)) return;
  if (tiles.size >= MAX_TILES) { alert(t('maxAlert')); return; }
  const tile = document.createElement('div');
  tile.className = 'tile';
  tile.innerHTML = `
    <div class="tile-head">
      <span class="lang"></span>
      <button class="audio" title="${t('audioTip')}">🔇</button>
      <button class="fs" title="${t('fsTip')}">⛶</button>
      <button class="rm" title="${t('rmTip')}">✕</button>
    </div>
    <select class="colls" style="margin:0 8px 4px;font-size:12px;max-width:calc(100% - 16px)"></select>
    <select class="programs" style="margin:0 8px 6px;font-size:12px;max-width:calc(100% - 16px)"></select>
    <div class="videowrap"></div>
    <div class="status">${t('loading')}</div>`;
  grid.appendChild(tile);
  tile.querySelector('.lang').textContent = lang.label || labelFor(lang.code);
  const status = tile.querySelector('.status');
  const selColl = tile.querySelector('.colls');
  const sel = tile.querySelector('.programs');
  const wrap = tile.querySelector('.videowrap');

  for (const [key, name] of collectionsFor()) {
    const o = document.createElement('option'); o.value = key; o.textContent = name; selColl.appendChild(o);
  }

  const video = document.createElement('video');
  video.muted = true; video.autoplay = true; video.playsInline = true; video.controls = true; video.preload = 'auto';
  wrap.appendChild(video);
  let loadTimer = null;
  const armWatchdog = () => {
    clearTimeout(loadTimer);
    loadTimer = setTimeout(() => {
      if (video.src && !video.error && video.readyState < 3 && !tile.classList.contains('novideo')) {
        status.style.display = ''; status.classList.add('err');
        status.textContent = t('slowMsg');
      }
    }, 12000);
  };
  video.addEventListener('playing', () => { clearTimeout(loadTimer); status.style.display = 'none'; });
  let retried = false;
  video.addEventListener('error', () => {
    clearTimeout(loadTimer);
    if (!retried && video.src) {
      retried = true;
      status.textContent = t('retrying');
      const src = video.src;
      setTimeout(() => { video.src = src; video.load(); video.play().catch(() => {}); armWatchdog(); }, 3000);
    } else {
      status.textContent = t('failMsg');
      status.classList.add('err');
    }
  });
  status.style.cursor = 'pointer';
  status.addEventListener('click', () => {
    if (status.classList.contains('err') && video.src) {
      status.classList.remove('err'); status.textContent = t('loading');
      video.load(); video.play().catch(() => {}); armWatchdog();
    }
  });

  const entry = { code: lang.code, coll: lang.coll || 'StudioMonthlyPrograms', prog: lang.prog || '',
                  video, audioBtn: tile.querySelector('.audio'), tile, sel, selColl, status, items: [], armWatchdog };
  tiles.set(lang.code, entry);
  selColl.value = entry.coll;
  updateCounter(); saveState(); refreshGlobalPicker();

  selColl.addEventListener('change', async () => { entry.coll = selColl.value; entry.prog = ''; await fillPrograms(entry, ''); });
  sel.addEventListener('change', async () => {
    const it = entry.items.find(x => x.naturalKey === sel.value);
    await loadTileProgram(entry, it);
  });
  entry.audioBtn.addEventListener('click', () => muteOthers(entry));
  tile.querySelector('.fs').addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else tile.requestFullscreen().catch(() => {});
  });
  tile.querySelector('.rm').addEventListener('click', () => {
    video.pause(); video.removeAttribute('src'); video.load();
    tiles.delete(lang.code); tile.remove();
    updateCounter(); saveState(); refreshGlobalPicker(); renderAddList();
  });

  // lengua nueva: heredar la publicación que ya suena en las demás tarjetas
  let inheritProg = '';
  if (!lang.coll && !lang.prog) {
    const ref = [...tiles.values()].find(x => x.code !== lang.code && x.prog && x.items && x.items.length);
    if (ref) {
      const refIt = ref.items.find(y => y.naturalKey === ref.prog);
      entry.coll = ref.coll;
      selColl.value = ref.coll;
      inheritProg = refIt ? refIt.naturalKey : '';
    }
  }
  await fillPrograms(entry, entry.prog || inheritProg, !!inheritProg);
}

let globProgReq = 0;
async function refreshGlobalPrograms(keepProg) {
  const req = ++globProgReq;
  const gc = document.getElementById('globColl');
  const gp = document.getElementById('globProg');
  const first = [...tiles.values()][0];
  gp.innerHTML = '';
  if (!first || !gc.value) return;
  const items = (first.coll === gc.value && first.items && first.items.length) ? first.items : await fetchCollection(first.code, gc.value);
  if (req !== globProgReq) return; // respuesta vieja: el usuario ya volvio a cambiar
  for (const it of items.slice(0, 120)) { const o = document.createElement('option'); o.value = normKey(it); o.textContent = it.title; gp.appendChild(o); }
  let idx = 0;
  if (keepProg) { const k = items.findIndex(it => normKey(it) === keepProg); if (k >= 0) idx = k; }
  gp.selectedIndex = idx;
}
function refreshGlobalPicker(force) {
  const gc = document.getElementById('globColl');
  const gp = document.getElementById('globProg');
  if (!force && (document.activeElement === gc || document.activeElement === gp)) return; // no reconstruir mientras el usuario lo usa
  const first = [...tiles.values()].find(x => x.items && x.items.length);
  const fp = first ? first.coll + ':' + first.items.length + ':' + (first.items[0] && first.items[0].naturalKey) + ':' + LANG : '';
  if (!force && fp === refreshGlobalPicker._fp && gp.options.length) return; // nada nuevo
  refreshGlobalPicker._fp = fp;
  const prevColl = gc.value, prevProg = gp.value;
  gc.innerHTML = '';
  for (const [key, name] of collectionsFor()) { const o = document.createElement('option'); o.value = key; o.textContent = name; gc.appendChild(o); }
  if (prevColl && [...gc.options].some(o => o.value === prevColl)) gc.value = prevColl;
  else if (first) gc.value = first.coll;
  // el selector de programas siempre sigue a la categoria elegida
  refreshGlobalPrograms(gc.value === prevColl ? prevProg : '');
}
document.getElementById('globColl').addEventListener('change', () => refreshGlobalPrograms(''));
document.getElementById('globApply').addEventListener('click', async () => {
  const coll = document.getElementById('globColl').value;
  const nk = document.getElementById('globProg').value;
  for (const x of tiles.values()) {
    x.selColl.value = coll;
    if (x.coll !== coll) { x.coll = coll; x.prog = ''; await fillPrograms(x, ''); }
    if (nk) {
      const it = x.items.find(y => normKey(y) === nk);
      if (it) { x.sel.value = it.naturalKey; await loadTileProgram(x, it); }
    }
    await new Promise(r => setTimeout(r, 250)); // respiro entre tarjetas
  }
});

async function loadCatalog() {
  try {
    const d = await fetchJSON(`${API}/languages/E/all?clientType=www`);
    ALL_SIGN_LANGS = (d.languages || []).filter(l => l.isSignLanguage).sort((a, b) => a.name.localeCompare(b.name));
  } catch (e) { ALL_SIGN_LANGS = []; }
  renderAddList();
}
function renderAddList() {
  const list = document.getElementById('addList');
  const q = (document.getElementById('addSearch').value || '').toLowerCase();
  list.innerHTML = '';
  const shown = ALL_SIGN_LANGS.filter(l => !q || l.name.toLowerCase().includes(q) || l.code.toLowerCase().includes(q) || (l.vernacular || '').toLowerCase().includes(q));
  if (!shown.length) { list.innerHTML = '<div style="padding:8px 10px;color:var(--muted);font-size:13px">' + t('noResults') + '</div>'; return; }
  for (const l of shown) {
    const b = document.createElement('button');
    const added = tiles.has(l.code);
    b.textContent = l.name + ' (' + l.code + ')' + (added ? ' ✓' : '');
    b.disabled = added;
    if (added) b.classList.add('added');
    b.addEventListener('click', async () => {
      await addTile({ code: l.code, label: l.name + ' (' + l.code + ')' });
      renderAddList();
    });
    list.appendChild(b);
  }
}
document.getElementById('addBtn').addEventListener('click', () => {
  const p = document.getElementById('addPanel');
  p.hidden = !p.hidden;
  if (!p.hidden) { document.getElementById('addSearch').value = ''; renderAddList(); document.getElementById('addSearch').focus(); }
});
document.getElementById('addSearch').addEventListener('input', renderAddList);
document.addEventListener('click', (e) => {
  if (!e.target.closest('.addwrap')) document.getElementById('addPanel').hidden = true;
});

function applyI18n() {
  document.documentElement.lang = t('htmlLang');
  document.title = t('title');
  document.getElementById('tTitle').textContent = t('title');
  document.getElementById('tSub').textContent = t('sub');
  document.getElementById('playAll').textContent = t('playAll');
  document.getElementById('pauseAll').textContent = t('pauseAll');
  document.getElementById('syncAll').textContent = t('syncAll');
  document.getElementById('addBtn').textContent = t('addBtn');
  document.getElementById('addSearch').placeholder = t('searchPh');
  document.getElementById('tForAll').textContent = t('forAll');
  document.getElementById('globApply').textContent = t('applyAll');
  document.getElementById('tFooter').textContent = t('footer');
  document.getElementById('langES').classList.toggle('active', LANG === 'es');
  document.getElementById('langEN').classList.toggle('active', LANG === 'en');
  updateCounter();
}
function setLang(l) {
  if (l === LANG) return;
  LANG = l;
  localStorage.setItem('jwSignMosaic.lang', l);
  applyI18n();
  for (const x of tiles.values()) { // re-traducir en caliente, sin tocar los vídeos
    const prev = x.selColl.value;
    x.selColl.innerHTML = '';
    for (const [key, name] of collectionsFor()) { const o = document.createElement('option'); o.value = key; o.textContent = name; x.selColl.appendChild(o); }
    x.selColl.value = prev;
    if (x.status.style.display !== 'none' && !x.status.classList.contains('err')) {
      x.status.textContent = x.tile.classList.contains('novideo') ? t('noVideoPub') : t('loading');
    } else if (x.status.classList.contains('err')) {
      x.status.textContent = t('failMsg');
    }
    x.tile.querySelector('.audio').title = t('audioTip');
    x.tile.querySelector('.fs').title = t('fsTip');
    x.tile.querySelector('.rm').title = t('rmTip');
  }
  refreshGlobalPicker(true);
  renderAddList();
}
document.getElementById('langES').addEventListener('click', () => setLang('es'));
document.getElementById('langEN').addEventListener('click', () => setLang('en'));

document.getElementById('playAll').addEventListener('click', () => allVideos().forEach(v => v.play().catch(() => {})));
document.getElementById('pauseAll').addEventListener('click', () => allVideos().forEach(v => v.pause()));
document.getElementById('syncAll').addEventListener('click', () => {
  const vs = allVideos().filter(v => !isNaN(v.duration));
  if (!vs.length) return;
  const t0 = Math.max(...vs.map(v => v.currentTime));
  vs.forEach(v => { v.currentTime = t0; v.play().catch(() => {}); });
});

setInterval(() => {
  for (const x of tiles.values()) {
    if (x.video.src && x.video.paused && !x.tile.classList.contains('novideo')) x.video.play().catch(() => {});
  }
}, 15000);

(async function init() {
  applyI18n();
  await loadCatalog();
  const state = loadState();
  for (const l of state.langs.slice(0, MAX_TILES)) {
    await addTile({ ...l, label: l.label || labelFor(l.code) });
    await new Promise(r => setTimeout(r, 400)); // escalonar: no ahogar la red con N vídeos a la vez
  }
})();
</script>
</body>
